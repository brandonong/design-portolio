name: Generate Gallery JSON

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate gallery.json
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const folders = [
            { key: "edgedalefields", dir: "hdb/168" },
            { key: "bishan", dir: "hdb/156BbishanSt" },
            { key: "edgedale", dir: "hdb/133edgedale" },
            { key: "brighthill", dir: "condo/41brighthill" },
            { key: "florence", dir: "condo/florenceResidence" }
          ];

          const result = {};

          folders.forEach(item => {
            const fullPath = path.join(process.cwd(), item.dir);
            if (fs.existsSync(fullPath)) {
              const files = fs.readdirSync(fullPath)
                .filter(file => /\.(jpg|jpeg|png|webp)$/i.test(file))
                .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

              result[item.key] = files.map(file => `${item.dir}/${file}`);
            } else {
              result[item.key] = [];
            }
          });

          fs.writeFileSync("gallery.json", JSON.stringify(result, null, 2));
          '

      - name: Commit and push gallery.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gallery.json
          git status
          git diff-index --quiet HEAD || (git commit -m "chore: auto-update gallery.json" && git push)
