name: Update photo manifest

on:
  push:
    paths:
      - "hdb/**"
      - "condo/**"
      - "landed/**"
      - "commercial/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images.json
        run: |
          python3 - <<'PY'
          import json, os

          ROOTS = ["hdb", "condo", "landed", "commercial"]
          EXT = (".jpg", ".jpeg", ".png", ".webp")
          out = {}

          for root in ROOTS:
              if not os.path.isdir(root):
                  continue
              for entry in sorted(os.listdir(root)):
                  folder = f"{root}/{entry}"
                  if not os.path.isdir(folder):
                      continue
                  files = sorted(
                      f for f in os.listdir(folder)
                      if f.lower().endswith(EXT) and os.path.isfile(os.path.join(folder, f))
                  )
                  if files:
                      out[folder] = files

          with open("images.json", "w") as fh:
              json.dump(out, fh, indent=1)
              fh.write("\n")

          print({k: len(v) for k, v in out.items()})
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images.json
          git diff --staged --quiet || git commit -m "chore: update photo manifest"
          git push
