<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP Design Studio | Portfolio</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161a22;
      --accent: #d4af37;
      --text-main: #f0f3f8;
      --text-muted: #9ba1b0;
      --border: #232936;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 60px; }

    header { text-align: center; padding: 40px 20px; background: #12151c; border-bottom: 1px solid var(--border); }
    header h1 { color: var(--accent); font-size: 2.2rem; margin-bottom: 8px; }
    header p { color: var(--text-muted); font-size: 1rem; }

    .filter-bar { display: flex; justify-content: center; gap: 10px; margin: 30px 20px 20px; flex-wrap: wrap; }
    .filter-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: var(--accent); color: #000; font-weight: bold; }

    .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; padding: 0 20px; max-width: 1200px; margin: 0 auto; }
    .project-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: transform 0.2s; }
    .project-card:hover { transform: translateY(-4px); }
    .card-img-wrap { position: relative; width: 100%; height: 220px; background: #202632; overflow: hidden; }
    .card-cover { width: 100%; height: 100%; object-fit: cover; }
    .gallery-count { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.75); color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; backdrop-filter: blur(4px); }
    .card-body { padding: 16px; }
    .card-body h3 { font-size: 1.2rem; margin-bottom: 6px; }
    .card-body p { color: var(--text-muted); font-size: 0.9rem; }

    /* Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 1000px; max-height: 90vh; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .modal-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .modal-close { background: none; border: none; color: #fff; font-size: 1.8rem; cursor: pointer; }
    .thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 20px; overflow-y: auto; max-height: 75vh; }
    .thumb-item { height: 120px; border-radius: 8px; overflow: hidden; cursor: pointer; background: #202632; }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }

    /* Fullscreen Viewer */
    .fullscreen-viewer { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; height: 100%; position: relative; }
    .fullscreen-viewer.active { display: flex; }
    .viewer-img-wrap { max-width: 100%; max-height: 65vh; display: flex; justify-content: center; }
    .viewer-img-wrap img { max-width: 100%; max-height: 65vh; object-fit: contain; border-radius: 8px; }
    .viewer-controls { display: flex; gap: 20px; margin-top: 16px; align-items: center; }
    .nav-btn, .back-btn { background: var(--border); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

    /* Floating Calculator Trigger & Section */
    .calc-trigger-wrap { text-align: center; margin: 40px 0; }
    .calc-toggle-btn { background: var(--accent); color: #000; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 25px; cursor: pointer; }
    .calc-section { display: none; max-width: 800px; margin: 0 auto 40px; padding: 24px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); }
    .calc-section.active { display: block; }
    .calc-group { margin-bottom: 20px; }
    .calc-group h4 { margin-bottom: 10px; color: var(--accent); }
    .calc-options { display: flex; gap: 10px; flex-wrap: wrap; }
    .calc-btn { background: #202632; border: 1px solid var(--border); color: #fff; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    .calc-btn.selected { background: var(--accent); color: #000; font-weight: bold; }
    .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .checkbox-label { background: #202632; padding: 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .checkbox-label.selected { border: 1px solid var(--accent); }
    .calc-result { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); }
    .calc-price { font-size: 1.8rem; color: var(--accent); margin: 10px 0; font-weight: bold; }
    .wa-link { display: inline-block; background: #25d366; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>AP Design Studio</h1>
    <p>Interior Design & Spatial Architecture Portfolio</p>
  </header>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All Projects</button>
    <button class="filter-btn" data-filter="residential">Residential</button>
    <button class="filter-btn" data-filter="commercial">Commercial</button>
  </div>

  <section class="portfolio-grid">
    <div class="project-card" data-project="florence-residence" data-category="residential">
      <div class="card-img-wrap">
        <img class="card-cover" src="" alt="Florence Residence">
        <span class="gallery-count">📷 0 Photos</span>
      </div>
      <div class="card-body">
        <h3>Florence Residence</h3>
        <p>Modern Minimalist Luxury</p>
      </div>
    </div>
  </section>

  <div class="calc-trigger-wrap">
    <button id="open-calc-btn" class="calc-toggle-btn">💡 Estimate Renovation Cost</button>
  </div>

  <section id="calculator-section" class="calc-section">
    <h3>Interactive Cost Calculator</h3>
    <div class="calc-group" id="prop-types">
      <h4>1. Property Type</h4>
      <div class="calc-options">
        <button class="calc-btn selected" data-base="38000">3-Room HDB</button>
        <button class="calc-btn" data-base="48000">4-Room HDB</button>
        <button class="calc-btn" data-base="58000">5-Room HDB / Condo</button>
      </div>
    </div>

    <div class="calc-group" id="finish-levels">
      <h4>2. Finish Level</h4>
      <div class="calc-options">
        <button class="calc-btn selected" data-multiplier="1.0">Essential</button>
        <button class="calc-btn" data-multiplier="1.25">Premium</button>
      </div>
    </div>

    <div class="calc-group" id="scope-items">
      <h4>3. Scope of Work</h4>
      <div class="checkbox-grid">
        <label class="checkbox-label"><input type="checkbox" value="Carpentry Work" data-cost="8000"> Custom Carpentry</label>
        <label class="checkbox-label"><input type="checkbox" value="Masonry & Tiling" data-cost="6000"> Masonry & Tiling</label>
        <label class="checkbox-label"><input type="checkbox" value="Electrical & Ceiling" data-cost="4500"> Electrical & False Ceiling</label>
      </div>
    </div>

    <div class="calc-result">
      <div>Estimated Range:</div>
      <div id="est-display" class="calc-price">$0</div>
      <a id="calc-whatsapp-btn" href="#" target="_blank" class="wa-link">💬 WhatsApp Consultation</a>
    </div>
  </section>

  <!-- Gallery Modal -->
  <div id="gallery-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Project Gallery</h3>
        <button id="modal-close" class="modal-close">&times;</button>
      </div>
      <div id="thumb-grid" class="thumb-grid"></div>
      
      <div id="fullscreen-viewer" class="fullscreen-viewer">
        <div class="viewer-img-wrap">
          <img id="modal-img" src="" alt="Full view">
        </div>
        <p id="modal-caption" style="margin-top:10px; color:var(--text-muted);"></p>
        <div class="viewer-controls">
          <button id="modal-prev" class="nav-btn">◀ Prev</button>
          <button id="back-to-thumbs" class="back-btn">Grid View</button>
          <button id="modal-next" class="nav-btn">Next ▶</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let PROJECTS_DATA = {};
    let currentProjectKey = null;
    let currentIndex = 0;

    document.addEventListener('DOMContentLoaded', () => {
      const modal = document.getElementById('gallery-modal');
      const modalTitle = document.getElementById('modal-title');
      const thumbGrid = document.getElementById('thumb-grid');
      const fullscreenViewer = document.getElementById('fullscreen-viewer');
      const modalImg = document.getElementById('modal-img');
      const modalCaption = document.getElementById('modal-caption');
      const closeBtn = document.getElementById('modal-close');
      const backBtn = document.getElementById('back-to-thumbs');
      const prevBtn = document.getElementById('modal-prev');
      const nextBtn = document.getElementById('modal-next');

      async function loadGalleryData() {
        try {
          const response = await fetch('./gallery.json');
          if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
          PROJECTS_DATA = await response.json();
          updatePortfolioGrid();
        } catch (err) {
          console.error("Failed to load gallery.json:", err);
        }
      }

      function updatePortfolioGrid() {
        const cards = document.querySelectorAll('.project-card[data-project]');
        cards.forEach(card => {
          const key = card.getAttribute('data-project');
          const project = PROJECTS_DATA[key];
          if (!project) return;

          const countBadge = card.querySelector('.gallery-count');
          const coverImg = card.querySelector('.card-cover');
          const gallery = project.gallery || [];

          if (countBadge) countBadge.textContent = `📷 ${gallery.length} Photos`;

          if (coverImg && gallery.length > 0) {
            if (project.coverFile) {
              const matched = gallery.find(item => item.name === project.coverFile);
              coverImg.src = matched ? matched.src : gallery[0].src;
            } else {
              coverImg.src = gallery[0].src;
            }
          }

          card.addEventListener('click', () => openThumbnailGrid(key));
        });
      }

      function openThumbnailGrid(projectKey) {
        currentProjectKey = projectKey;
        const project = PROJECTS_DATA[projectKey];
        if (!project || !project.gallery || project.gallery.length === 0) return;

        if (modalTitle) modalTitle.textContent = `${project.title} (${project.gallery.length} Photos)`;
        if (thumbGrid) {
          thumbGrid.innerHTML = '';
          project.gallery.forEach((imgObj, index) => {
            const thumbItem = document.createElement('div');
            thumbItem.className = 'thumb-item';
            thumbItem.innerHTML = `<img src="${imgObj.src}" alt="${imgObj.name}" loading="lazy">`;
            thumbItem.addEventListener('click', () => openFullscreenImage(index));
            thumbGrid.appendChild(thumbItem);
          });
          thumbGrid.style.display = 'grid';
        }

        if (fullscreenViewer) fullscreenViewer.classList.remove('active');
        if (modal) modal.classList.add('active');
      }

      function openFullscreenImage(index) {
        currentIndex = index;
        const project = PROJECTS_DATA[currentProjectKey];
        const activeGallery = project.gallery;

        if (modalImg) modalImg.src = activeGallery[currentIndex].src;
        if (modalCaption) modalCaption.textContent = `${project.title} — Photo ${currentIndex + 1} of ${activeGallery.length}`;

        if (thumbGrid) thumbGrid.style.display = 'none';
        if (fullscreenViewer) fullscreenViewer.classList.add('active');
      }

      if (backBtn) {
        backBtn.addEventListener('click', () => {
          if (fullscreenViewer) fullscreenViewer.classList.remove('active');
          if (thumbGrid) thumbGrid.style.display = 'grid';
        });
      }

      if (closeBtn) closeBtn.addEventListener('click', () => modal?.classList.remove('active'));

      if (prevBtn) {
        prevBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!currentProjectKey || !PROJECTS_DATA[currentProjectKey]) return;
          const gallery = PROJECTS_DATA[currentProjectKey].gallery;
          currentIndex = (currentIndex - 1 + gallery.length) % gallery.length;
          openFullscreenImage(currentIndex);
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!currentProjectKey || !PROJECTS_DATA[currentProjectKey]) return;
          const gallery = PROJECTS_DATA[currentProjectKey].gallery;
          currentIndex = (currentIndex + 1) % gallery.length;
          openFullscreenImage(currentIndex);
        });
      }

      if (modal) {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) modal.classList.remove('active');
        });
      }

      // Filter Logic
      const buttons = document.querySelectorAll('.filter-btn');
      const cards = document.querySelectorAll('.project-card');

      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const filter = btn.getAttribute('data-filter');

          cards.forEach(c => {
            if (filter === 'all' || c.getAttribute('data-category') === filter) {
              c.style.display = 'flex';
            } else {
              c.style.display = 'none';
            }
          });
        });
      });

      // Calculator Logic
      const openCalcBtn = document.getElementById('open-calc-btn');
      const calcSection = document.getElementById('calculator-section');

      if (openCalcBtn && calcSection) {
        openCalcBtn.addEventListener('click', () => {
          calcSection.classList.toggle('active');
          openCalcBtn.classList.toggle('active');
          if (calcSection.classList.contains('active')) {
            calcSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        });
      }

      function initCalculator() {
        const propBtns = document.querySelectorAll('#prop-types .calc-btn');
        const finishBtns = document.querySelectorAll('#finish-levels .calc-btn');
        const checkboxes = document.querySelectorAll('#scope-items input[type="checkbox"]');
        const estDisplay = document.getElementById('est-display');
        const waBtn = document.getElementById('calc-whatsapp-btn');

        if (!estDisplay || !waBtn) return;

        function calculateEstimate() {
          let basePrice = 38000;
          let selectedProp = "3-Room HDB";
          propBtns.forEach(btn => {
            if (btn.classList.contains('selected')) {
              basePrice = parseInt(btn.getAttribute('data-base'));
              selectedProp = btn.textContent.trim();
            }
          });

          let scopeTotal = 0;
          let selectedScopes = [];
          checkboxes.forEach(cb => {
            const parent = cb.parentElement;
            if (cb.checked) {
              parent.classList.add('selected');
              scopeTotal += parseInt(cb.getAttribute('data-cost'));
              selectedScopes.push(cb.value);
            } else {
              parent.classList.remove('selected');
            }
          });

          let multiplier = 1.0;
          let selectedFinish = "Essential";
          finishBtns.forEach(btn => {
            if (btn.classList.contains('selected')) {
              multiplier = parseFloat(btn.getAttribute('data-multiplier'));
              selectedFinish = btn.textContent.trim();
            }
          });

          const totalMid = (basePrice + scopeTotal) * multiplier;
          const minEstimate = Math.round((totalMid * 0.95) / 1000) * 1000;
          const maxEstimate = Math.round((totalMid * 1.15) / 1000) * 1000;

          const formattedMin = "$" + minEstimate.toLocaleString();
          const formattedMax = "$" + maxEstimate.toLocaleString();
          estDisplay.textContent = `${formattedMin} - ${formattedMax}`;

          const scopeItemsText = selectedScopes.length > 0 
            ? selectedScopes.map(item => `%0A - ${item}`).join('') 
            : '%0A - Basic Space Planning';

          const rawMessage = 
            `Hi Irene, I calculated an interior renovation estimate on AP Design Studio website and would like to arrange a consultation!%0A%0A` +
            `📋 *Project Summary:*%0A` +
            `• Property Type: ${selectedProp}%0A` +
            `• Finish Standard: ${selectedFinish}%0A` +
            `• Estimated Budget: ${formattedMin} - ${formattedMax}%0A%0A` +
            `🛠️ *Selected Scope of Work:*${scopeItemsText}%0A%0A` +
            `-----------------------------------%0A` +
            `📌 *Key Collection / Timeline:* [e.g. Q3 2026 / Ready Now]%0A` +
            `📌 *Property Location / Estate:* [e.g. Tampines GreenCourt]%0A` +
            `📎 *(I will attach my floor plan in the next message)*`;

          waBtn.href = `https://wa.me/6597869046?text=${rawMessage}`;
        }

        propBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            propBtns.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            calculateEstimate();
          });
        });

        finishBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            finishBtns.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            calculateEstimate();
          });
        });

        checkboxes.forEach(cb => cb.addEventListener('change', calculateEstimate));
        calculateEstimate();
      }

      loadGalleryData();
      initCalculator();
    });
  </script>
</body>
</html>
